<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Nathanael Siane | Holy Baptism &amp; Christening</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* --- ART-DIRECTED DESIGN SYSTEM --- */
    :root {
      --color-bg: #FAF8F5;
      --color-surface: #FFFFFF;
      --color-subtle-bg: #F3EFEA;
      --color-border: #E2DAD2;
      --color-border-dark: #8C827A;
      
      --color-navy-dark: #162432;
      --color-navy-accent: #28425C;
      --color-soft-blue: #9FB8CD;
      --color-soft-blue-light: #EBF1F6;
      --color-text-main: #1D2125;
      --color-text-muted: #5C656E;
      
      --font-calligraphy: 'Alex Brush', cursive;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-tech: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;

      --ease-editorial: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* --- RESET & BASE STYLES --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: #E2DBD4;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-tech);
      background-color: var(--color-bg);
      color: var(--color-text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* MASTER CANVAS WRAPPER */
    .site-wrapper {
      width: 100%;
      max-width: 1000px;
      background: var(--color-surface);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      border-left: 1px solid var(--color-border);
      border-right: 1px solid var(--color-border);
    }

    /* --- MOTION SYSTEM --- */
    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s var(--ease-editorial), transform 0.8s var(--ease-editorial);
      will-change: opacity, transform;
    }

    .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .stagger-parent .stagger-child {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s var(--ease-editorial), transform 0.6s var(--ease-editorial);
    }

    .stagger-parent.is-visible .stagger-child:nth-child(1) { transition-delay: 0.04s; }
    .stagger-parent.is-visible .stagger-child:nth-child(2) { transition-delay: 0.09s; }
    .stagger-parent.is-visible .stagger-child:nth-child(3) { transition-delay: 0.14s; }
    .stagger-parent.is-visible .stagger-child:nth-child(4) { transition-delay: 0.19s; }
    .stagger-parent.is-visible .stagger-child:nth-child(5) { transition-delay: 0.24s; }
    .stagger-parent.is-visible .stagger-child:nth-child(6) { transition-delay: 0.29s; }

    .stagger-parent.is-visible .stagger-child {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- 01. TOP ANNOUNCEMENT BAR --- */
    .announcement-bar {
      background-color: var(--color-navy-dark);
      color: var(--color-surface);
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .announcement-bar .title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .announcement-bar .dot {
      width: 6px;
      height: 6px;
      background-color: var(--color-soft-blue);
      border-radius: 50%;
      animation: pulse-dot 2.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .announcement-bar .bar-cta {
      color: var(--color-soft-blue);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.3s ease;
    }

    .announcement-bar .bar-cta:hover {
      color: var(--color-surface);
    }

    /* --- 02. EDITORIAL STICKY NAVIGATION --- */
    .sticky-nav {
      position: sticky;
      top: 0;
      background: rgba(250, 248, 245, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--color-border);
      z-index: 1000;
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.3s ease;
    }

    .sticky-nav.is-scrolled {
      border-bottom-color: var(--color-border-dark);
    }

    .nav-brand {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: var(--color-navy-dark);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 28px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--color-navy-dark);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      font-weight: 600;
      position: relative;
      padding-bottom: 4px;
      transition: color 0.3s ease;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 1px;
      background-color: var(--color-navy-accent);
      transition: width 0.3s var(--ease-editorial);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .btn-nav-rsvp {
      background-color: var(--color-navy-accent);
      color: var(--color-surface);
      text-decoration: none;
      padding: 9px 18px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
      border: 1px solid var(--color-navy-accent);
      transition: background-color 0.3s ease, color 0.3s ease, transform 0.3s var(--ease-editorial);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-nav-rsvp .arrow {
      transition: transform 0.3s var(--ease-editorial);
    }

    .btn-nav-rsvp:hover {
      background-color: transparent;
      color: var(--color-navy-accent);
    }

    .btn-nav-rsvp:hover .arrow {
      transform: translateX(3px);
    }

    /* --- 03. HERO SECTION (EDITORIAL & ASYMMETRICAL) --- */
    .hero {
      padding: 80px 48px 60px;
      border-bottom: 1px solid var(--color-border);
      position: relative;
      background: linear-gradient(180deg, var(--color-subtle-bg) 0%, var(--color-surface) 100%);
    }

    .hero-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 16px;
    }

    .hero-kicker {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 11px;
      color: var(--color-navy-accent);
      font-weight: 700;
    }

    .hero-date-tag {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 15px;
      color: var(--color-text-muted);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 40px;
      align-items: center;
    }

    .hero-typography {
      text-align: left;
    }

    .hero h1.calligraphy-title {
      font-family: var(--font-calligraphy);
      font-size: 104px;
      font-weight: 400;
      color: var(--color-navy-dark);
      line-height: 0.85;
      margin-left: -8px;
      margin-bottom: 16px;
    }

    .hero .editorial-sub {
      font-family: var(--font-serif);
      font-size: 32px;
      color: var(--color-text-main);
      line-height: 1.15;
      font-weight: 400;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
    }

    .hero .editorial-sub span {
      display: block;
      font-style: italic;
      color: var(--color-navy-accent);
      font-size: 26px;
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: var(--color-navy-dark);
      color: var(--color-surface);
      text-decoration: none;
      padding: 20px 32px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      font-weight: 700;
      border: 1px solid var(--color-navy-dark);
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      min-height: 54px;
      text-align: center;
    }

    .btn-primary .arrow {
      transition: transform 0.3s var(--ease-editorial);
    }

    .btn-primary:hover {
      background-color: var(--color-surface);
      color: var(--color-navy-dark);
    }

    .btn-primary:hover .arrow {
      transform: translateX(5px);
    }

    /* SCREENSHOT / VISUAL FRAME IN HERO */
    .hero-visual-frame {
      border: 1px solid var(--color-border);
      background-color: var(--color-subtle-bg);
      padding: 12px;
      position: relative;
    }

    .hero-visual-inner {
      aspect-ratio: 4/5;
      border: 1px solid var(--color-border);
      background-color: #E8E2DA;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero-visual-inner .frame-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--color-navy-accent);
      margin-top: 12px;
      font-weight: 600;
    }

    /* --- 04. ANIMATED TICKER MARQUEE --- */
    .ticker-container {
      width: 100%;
      overflow: hidden;
      background-color: var(--color-navy-dark);
      color: var(--color-surface);
      border-bottom: 1px solid var(--color-navy-dark);
      padding: 14px 0;
      display: flex;
      user-select: none;
    }

    .ticker-track {
      display: flex;
      white-space: nowrap;
      will-change: transform;
      animation: ticker-scroll 32s linear infinite;
    }

    .ticker-item {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      font-weight: 500;
      padding: 0 28px;
      display: inline-flex;
      align-items: center;
      gap: 28px;
    }

    .ticker-symbol {
      color: var(--color-soft-blue);
      font-size: 9px;
    }

    @keyframes ticker-scroll {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }

    /* --- 05. ABOUT SECTION (STRONG GRID & TYPOGRAPHY) --- */
    .about-section {
      padding: 80px 48px;
      border-bottom: 1px solid var(--color-border);
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
    }

    .about-sidebar {
      border-right: 1px solid var(--color-border);
      padding-right: 32px;
    }

    .about-sidebar .kicker {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--color-navy-accent);
      font-weight: 700;
      margin-bottom: 12px;
      display: block;
    }

    .about-sidebar h2 {
      font-family: var(--font-serif);
      font-size: 32px;
      line-height: 1.15;
      color: var(--color-navy-dark);
      font-weight: 400;
    }

    .rainbow-tag {
      display: inline-block;
      border: 1px solid var(--color-navy-accent);
      color: var(--color-navy-accent);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
      padding: 8px 14px;
      margin-top: 24px;
    }

    .about-content {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .about-body p {
      font-size: 16px;
      color: var(--color-text-main);
      line-height: 1.8;
      margin-bottom: 20px;
      font-weight: 400;
    }

    .about-body p strong {
      color: var(--color-navy-dark);
      font-weight: 600;
    }

    .stats-table {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      padding: 24px 0;
      margin-top: 24px;
    }

    .stat-cell {
      border-right: 1px solid var(--color-border);
      padding: 0 16px;
    }

    .stat-cell:first-child { padding-left: 0; }
    .stat-cell:last-child { border-right: none; }

    .stat-cell .value {
      font-family: var(--font-serif);
      font-size: 26px;
      color: var(--color-navy-dark);
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-cell .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--color-text-muted);
      font-weight: 600;
    }

    /* --- 06. GALLERY SECTION --- */
    .gallery-section {
      padding: 80px 48px;
      border-bottom: 1px solid var(--color-border);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 16px;
    }

    .section-header h3 {
      font-family: var(--font-serif);
      font-size: 36px;
      color: var(--color-navy-dark);
      font-weight: 400;
    }

    .section-header p {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--color-text-muted);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: 7fr 5fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .screenshot-card {
      border: 1px solid var(--color-border);
      background-color: var(--color-subtle-bg);
      padding: 12px;
      transition: border-color 0.3s ease;
    }

    .screenshot-card:hover {
      border-color: var(--color-navy-accent);
    }

    .screenshot-viewport {
      width: 100%;
      background-color: #E6E0D7;
      border: 1px solid var(--color-border);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
    }

    .screenshot-viewport.ratio-large {
      aspect-ratio: 16/10;
    }

    .screenshot-viewport.ratio-portrait {
      aspect-ratio: 4/5;
    }

    .screenshot-viewport.ratio-banner {
      aspect-ratio: 21/9;
    }

    .screenshot-viewport .placeholder-text {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      color: var(--color-navy-dark);
      margin-top: 8px;
    }

    .screenshot-caption {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 11px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* --- 07. EVENT DETAILS (HYPERLINKED LOCATIONS) --- */
    .details-section {
      padding: 80px 48px;
      border-bottom: 1px solid var(--color-border);
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    .venue-card {
      border: 1px solid var(--color-border);
      padding: 40px 32px;
      background-color: var(--color-surface);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.3s ease, transform 0.3s var(--ease-editorial);
    }

    .venue-card:hover {
      border-color: var(--color-navy-dark);
      transform: translateY(-2px);
    }

    .venue-type {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--color-navy-accent);
      font-weight: 700;
      margin-bottom: 16px;
      display: block;
    }

    .venue-name {
      font-family: var(--font-serif);
      font-size: 28px;
      color: var(--color-navy-dark);
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .venue-address {
      font-size: 14px;
      color: var(--color-text-muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .venue-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      color: var(--color-navy-dark);
      text-decoration: none;
      border-bottom: 1px solid var(--color-navy-dark);
      padding-bottom: 4px;
      width: fit-content;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    .venue-link:hover {
      color: var(--color-navy-accent);
      border-color: var(--color-navy-accent);
    }

    .venue-link .arrow {
      transition: transform 0.3s var(--ease-editorial);
    }

    .venue-link:hover .arrow {
      transform: translateX(4px);
    }

    /* DRESS CODE STRIP */
    .dress-code-container {
      margin-top: 40px;
      border: 1px solid var(--color-border);
      padding: 32px;
      background-color: var(--color-subtle-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dress-code-info h4 {
      font-family: var(--font-serif);
      font-size: 22px;
      color: var(--color-navy-dark);
      margin-bottom: 4px;
      font-weight: 400;
    }

    .dress-code-info p {
      font-size: 13px;
      color: var(--color-text-muted);
    }

    .palette-swatches {
      display: flex;
      gap: 12px;
    }

    .swatch-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .swatch-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .swatch-circle.w { background-color: #FFFFFF; }
    .swatch-circle.b { background-color: #E6DAD0; }
    .swatch-circle.sb { background-color: #9FB8CD; }
    .swatch-circle.n { background-color: #162432; }

    .swatch-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--color-text-muted);
    }

    /* --- 08. EDITORIAL WISHLIST --- */
    .registry-section {
      padding: 80px 48px;
      border-bottom: 1px solid var(--color-border);
    }

    .registry-grid-list {
      border-top: 1px solid var(--color-navy-dark);
    }

    .registry-row {
      display: grid;
      grid-template-columns: 80px 1fr 200px;
      padding: 24px 0;
      border-bottom: 1px solid var(--color-border);
      align-items: center;
      transition: background-color 0.3s ease, padding-left 0.3s var(--ease-editorial);
    }

    .registry-row:hover {
      background-color: var(--color-subtle-bg);
      padding-left: 16px;
    }

    .registry-num {
      font-family: var(--font-serif);
      font-size: 28px;
      color: var(--color-border-dark);
      font-weight: 400;
    }

    .registry-title h4 {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-navy-dark);
      letter-spacing: 0.2px;
    }

    .registry-meta {
      font-size: 12px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-align: right;
    }

    /* --- 09. RSVP SECTION --- */
    .rsvp-section {
      padding: 80px 48px;
      border-bottom: 1px solid var(--color-border);
      background-color: var(--color-subtle-bg);
    }

    .rsvp-wrapper {
      max-width: 640px;
      margin: 0 auto;
      border: 1px solid var(--color-navy-dark);
      background-color: var(--color-surface);
      padding: 48px 40px;
