<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nathanael Siane | Christening Invitation & RSVP</title>
  
  <!-- Google Fonts: Calligraphy + Editorial Serif + Tech Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* --- DESIGN SYSTEM & COLOR PALETTE --- */
    :root {
      --color-white: #FFFFFF;
      --color-cream-bg: #FBF9F6;
      --color-beige-light: #F4EFEA;
      --color-beige: #E6DAD0;
      --color-beige-dark: #CBB9A8;
      --color-soft-blue: #B8CEDC;
      --color-navy-accent: #2A435D;
      --color-navy-dark: #192C3F;
      --color-text-main: #222222;
      --color-text-muted: #55606A;
      
      /* Typography Stack */
      --font-calligraphy: 'Alex Brush', cursive;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-tech: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;

      /* Motion Durations & Easings */
      --ease-editorial: cubic-bezier(0.16, 1, 0.3, 1);
      --transition-smooth: 0.3s var(--ease-editorial);
    }

    /* --- RESET & BASE STYLES --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: #ECE7E1;
    }

    body {
      font-family: var(--font-tech);
      background-color: var(--color-cream-bg);
      color: var(--color-text-main);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    .site-wrapper {
      width: 100%;
      max-width: 800px;
      background: var(--color-white);
      box-shadow: 0 20px 60px rgba(25, 44, 63, 0.07);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      border-left: 1px solid rgba(0,0,0,0.03);
      border-right: 1px solid rgba(0,0,0,0.03);
    }

    /* --- RESTRAINED SCROLL-REVEAL SYSTEM --- */
    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.8s var(--ease-editorial), transform 0.8s var(--ease-editorial);
      will-change: opacity, transform;
    }

    .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Staggered Children Delays */
    .stagger-parent .stagger-child {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.6s var(--ease-editorial), transform 0.6s var(--ease-editorial);
    }

    .stagger-parent.is-visible .stagger-child:nth-child(1) { transition-delay: 0.05s; }
    .stagger-parent.is-visible .stagger-child:nth-child(2) { transition-delay: 0.12s; }
    .stagger-parent.is-visible .stagger-child:nth-child(3) { transition-delay: 0.19s; }
    .stagger-parent.is-visible .stagger-child:nth-child(4) { transition-delay: 0.26s; }
    .stagger-parent.is-visible .stagger-child:nth-child(5) { transition-delay: 0.33s; }
    .stagger-parent.is-visible .stagger-child:nth-child(6) { transition-delay: 0.40s; }

    .stagger-parent.is-visible .stagger-child {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- 01. ANNOUNCEMENT BAR --- */
    .announcement-bar {
      background-color: var(--color-navy-dark);
      color: var(--color-white);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .announcement-bar .title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .announcement-bar .dot {
      width: 6px;
      height: 6px;
      background-color: var(--color-soft-blue);
      border-radius: 50%;
      animation: pulse-dot 2.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .announcement-bar .bar-cta {
      color: var(--color-soft-blue);
      text-decoration: none;
      font-weight: 700;
      transition: opacity var(--transition-smooth);
    }

    .announcement-bar .bar-cta:hover {
      opacity: 0.75;
    }

    /* --- MINIMAL STICKY NAVIGATION --- */
    .sticky-nav {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-beige-light);
      z-index: 1000;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color var(--transition-smooth), box-shadow var(--transition-smooth);
    }

    .sticky-nav.is-scrolled {
      border-bottom-color: var(--color-beige);
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--color-navy-dark);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
      position: relative;
      padding-bottom: 4px;
      transition: color var(--transition-smooth);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 1.5px;
      background-color: var(--color-soft-blue);
      transition: width 0.3s var(--ease-editorial);
    }

    .nav-links a:hover {
      color: var(--color-navy-accent);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .btn-nav {
      background-color: var(--color-navy-accent);
      color: var(--color-white);
      text-decoration: none;
      padding: 8px 16px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background-color var(--transition-smooth), transform var(--transition-smooth);
    }

    .btn-nav .arrow {
      transition: transform 0.25s var(--ease-editorial);
    }

    .btn-nav:hover {
      background-color: var(--color-navy-dark);
      transform: translateY(-1px);
    }

    .btn-nav:hover .arrow {
      transform: translateX(3px);
    }

    /* --- HERO SECTION --- */
    .hero {
      background: linear-gradient(180deg, rgba(184, 206, 220, 0.2) 0%, rgba(251, 249, 246, 0) 100%);
      padding: 60px 32px 36px;
      text-align: center;
    }

    .hero .kicker {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 11px;
      color: var(--color-navy-accent);
      margin-bottom: 16px;
      font-weight: 700;
    }

    .hero h1.calligraphy-title {
      font-family: var(--font-calligraphy);
      font-size: 80px;
      font-weight: 400;
      color: var(--color-navy-dark);
      line-height: 0.95;
      margin-bottom: 12px;
    }

    .hero .editorial-sub {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 24px;
      color: var(--color-text-muted);
      line-height: 1.3;
      margin-bottom: 28px;
    }

    /* PRIMARY BUTTON WITH ANIMATED ARROW */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background-color: var(--color-navy-accent);
      color: var(--color-white);
      text-decoration: none;
      padding: 18px 24px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      font-weight: 700;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(42, 67, 93, 0.15);
      transition: background-color var(--transition-smooth), box-shadow var(--transition-smooth), transform var(--transition-smooth);
      text-align: center;
    }

    .btn-primary .arrow {
      transition: transform 0.25s var(--ease-editorial);
    }

    .btn-primary:hover {
      background-color: var(--color-navy-dark);
      box-shadow: 0 12px 28px rgba(25, 44, 63, 0.22);
      transform: translateY(-2px);
    }

    .btn-primary:hover .arrow {
      transform: translateX(4px);
    }

    /* --- PREMIUM TICKER --- */
    .ticker-container {
      width: 100%;
      overflow: hidden;
      background-color: rgba(184, 206, 220, 0.15);
      border-top: 1px solid var(--color-beige);
      border-bottom: 1px solid var(--color-beige);
      padding: 12px 0;
      display: flex;
      user-select: none;
    }

    .ticker-track {
      display: flex;
      white-space: nowrap;
      will-change: transform;
      animation: ticker-scroll 28s linear infinite;
    }

    .ticker-item {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      color: var(--color-navy-dark);
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      gap: 20px;
    }

    .ticker-symbol {
      color: var(--color-navy-accent);
      font-size: 10px;
      opacity: 0.7;
    }

    @keyframes ticker-scroll {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }

    /* --- ABOUT SECTION --- */
    .about-section {
      text-align: center;
      padding: 48px 32px;
      background-color: var(--color-cream-bg);
      border-bottom: 1px solid var(--color-beige-light);
    }

    .about-kicker {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--color-navy-accent);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .about-title {
      font-size: 28px;
      color: var(--color-navy-dark);
      margin-bottom: 24px;
      font-weight: 400;
    }

    .about-title span.serif-highlight {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 600;
      color: var(--color-navy-accent);
    }

    .about-body {
      font-size: 15px;
      color: var(--color-text-main);
      max-width: 580px;
      margin: 0 auto 32px;
      line-height: 1.8;
    }

    .rainbow-badge {
      display: inline-block;
      background-color: rgba(184, 206, 220, 0.25);
      color: var(--color-navy-dark);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
      transition: background-color var(--transition-smooth), transform var(--transition-smooth);
    }

    .rainbow-badge:hover {
      background-color: rgba(184, 206, 220, 0.4);
      transform: scale(1.02);
    }

    .stats-grid {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 32px;
      border-top: 1px solid var(--color-beige);
      border-bottom: 1px solid var(--color-beige);
      padding: 20px 0;
    }

    .stat-item .stat-value {
      font-family: var(--font-serif);
      font-size: 22px;
      color: var(--color-navy-dark);
      font-weight: 600;
    }

    .stat-item .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--color-text-muted);
    }

    /* --- SECTION CONTAINER --- */
    .section {
      padding: 48px 32px;
      scroll-margin-top: 60px;
    }

    /* --- PHOTO GALLERY SECTION --- */
    .photo-section {
      padding: 48px 32px;
    }

    .section-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .section-header h3 {
      font-family: var(--font-serif);
      font-size: 32px;
      color: var(--color-navy-dark);
      margin-bottom: 8px;
    }

    .section-header p {
      font-size: 13px;
      color: var(--color-text-muted);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }

    .photo-placeholder {
      background-color: var(--color-beige-light);
      border: 1px dashed var(--color-beige-dark);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      min-height: 200px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: background-color 0.4s var(--ease-editorial), border-color 0.4s var(--ease-editorial), transform 0.4s var(--ease-editorial);
    }

    .photo-placeholder .photo-icon {
      font-size: 20px;
      margin-bottom: 8px;
      opacity: 0.6;
      transition: transform 0.4s var(--ease-editorial), opacity 0.4s var(--ease-editorial);
    }

    .photo-placeholder:hover {
      background-color: var(--color-beige);
      border-color: var(--color-navy-accent);
      transform: translateY(-2px);
    }

    .photo-placeholder:hover .photo-icon {
      transform: scale(1.12);
      opacity: 0.9;
    }

    .photo-item-1 { grid-column: span 7; height: 280px; }
    .photo-item-2 { grid-column: span 5; height: 280px; }
    .photo-item-3 { grid-column: span 12; height: 320px; }

    /* EVENT DETAILS & DRESS CODE */
    .event-card {
      background-color: var(--color-cream-bg);
      border: 1px solid var(--color-beige);
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
      margin-bottom: 40px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .event-card:hover {
      border-color: var(--color-beige-dark);
      box-shadow: 0 8px 24px rgba(0,0,0,0.02);
    }

    .event-card h3.editorial-heading {
      font-family: var(--font-serif);
      font-size: 28px;
      color: var(--color-navy-dark);
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .event-card p {
      font-size: 15px;
      color: var(--color-text-main);
      margin-bottom: 8px;
    }

    .event-card .time-highlight {
      font-weight: 700;
      color: var(--color-navy-accent);
      letter-spacing: 0.5px;
    }

    .dress-code-box {
      background-color: rgba(184, 206, 220, 0.12);
      border: 1px solid rgba(184, 206, 220, 0.4);
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
      margin-bottom: 48px;
    }

    .dress-code-box h4 {
      font-family: var(--font-serif);
      font-size: 22px;
      color: var(--color-navy-dark);
      margin-bottom: 6px;
    }

    .swatch-wrapper {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
    }

    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: transform 0.3s var(--ease-editorial);
    }

    .swatch:hover {
      transform: scale(1.15);
    }

    .swatch-white { background-color: #FFFFFF; border: 1px solid #E0E0E0; }
    .swatch-beige { background-color: #E6DAD0; }
    .swatch-blue  { background-color: #B8CEDC; }
    .swatch-navy  { background-color: #2A435D; }

    /* EDITORIAL GIFT REGISTRY */
    .editorial-registry {
      margin-bottom: 56px;
    }

    .registry-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .registry-header h3 {
      font-family: var(--font-serif);
      font-size: 32px;
      color: var(--color-navy-dark);
      margin-bottom: 8px;
    }

    .registry-note {
      font-size: 13px;
      color: var(--color-text-muted);
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .registry-list {
      border-top: 1px solid var(--color-beige);
    }

    .registry-item {
      display: flex;
      align-items: center;
      padding: 20px 8px;
      border-bottom: 1px solid var(--color-beige);
      transition: background-color 0.3s var(--ease-editorial), padding-left 0.3s var(--ease-editorial);
    }

    .registry-item:hover {
      background-color: var(--color-cream-bg);
      padding-left: 18px;
    }

    .item-number {
      font-family: var(--font-serif);
      font-size: 36px;
      font-weight: 600;
      color: var(--color-beige-dark);
      width: 70px;
      flex-shrink: 0;
      line-height: 1;
      transition: color 0.3s var(--ease-editorial);
    }

    .registry-item:hover .item-number {
      color: var(--color-navy-accent);
    }

    .item-content h4 {
      font-family: var(--font-tech);
      font-size: 15px;
      font-weight: 700;
      color: var(--color-navy-dark);
      margin-bottom: 2px;
      letter-spacing: 0.2px;
    }

    .item-content p {
      font-size: 12px;
      color: var(--color-text-muted);
    }

    /* RSVP CARD */
    .rsvp-card {
      background: var(--color-white);
      border: 2px solid var(--color-soft-blue);
      border-radius: 16px;
      padding: 40px 28px;
      box-shadow: 0 16px 40px rgba(42, 67, 93, 0.08);
      margin-bottom: 48px;
    }

    .rsvp-card h2.calligraphy-headline {
      font-family: var(--font-calligraphy);
      font-size: 64px;
      color: var(--color-navy-dark);
      text-align: center;
      line-height: 0.9;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
      color: var(--color-navy-dark);
      margin-bottom: 8px;
    }

    .form-group input, 
    .form-group select, 
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--color-beige-dark);
      border-radius: 8px;
      font-family: var(--font-tech);
      font-size: 15px;
      background-color: var(--color-cream-bg);
      color: var(--color-text-main);
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .form-group input:focus, 
    .form-group select:focus, 
    .form-group textarea:focus {
      border-color: var(--color-navy-accent);
      box-shadow: 0 0 0 3px rgba(42, 67, 93, 0.08);
    }

    /* --- FINAL CONVERSION SECTION --- */
    .final-conversion {
      background-color: var(--color-navy-dark);
      color: var(--color-white);
      padding: 64px 32px;
      text-align: center;
      position: relative;
    }

    .conversion-headline {
      font-family: var(--font-serif);
      font-size: 36px;
      line-height: 1.25;
      margin-bottom: 20px;
      font-weight: 400;
    }

    .conversion-headline span {
      font-style: italic;
      color: var(--color-soft-blue);
    }

    .conversion-subtext {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      max-width: 480px;
      margin: 0 auto 32px;
      line-height: 1.6;
    }

    .btn-conversion {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--color-white);
      color: var(--color-navy-dark);
      text-decoration: none;
      padding: 18px 36px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      border-radius: 6px;
      transition: background-color var(--transition-smooth), transform var(--transition-smooth), box-shadow var(--transition-smooth);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .btn-conversion .arrow {
      transition: transform 0.25s var(--ease-editorial);
    }

    .btn-conversion:hover {
      background-color: var(--color-soft-blue);
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(0,0,0,0.28);
    }

    .btn-conversion:hover .arrow {
      transform: translateX(4px);
    }

    /* --- MINIMAL FOOTER --- */
    footer {
      background-color: var(--color-navy-dark);
      color: rgba(255, 255, 255, 0.6);
      padding: 40px 32px 32px;
